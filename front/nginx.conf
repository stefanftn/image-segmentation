server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # index.html and config.js were the only two files that used to change
    # between deploys. That's no longer true — styles.css and every file
    # under js/ now change just as often (a redesign, a new module) — so the
    # same no-cache policy now covers all of it. Leaving any of these
    # cacheable is exactly the "why is it still doing the old thing"
    # confusion this comment already warned about once: index.html loads
    # fresh, so the new markup shows up, but a stale cached styles.css or
    # js/theme.js makes it look like the new markup is broken rather than
    # just unstyled/unwired.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /styles.css {
        add_header Cache-Control "no-cache";
    }
    location /js/ {
        add_header Cache-Control "no-cache";
    }
}
