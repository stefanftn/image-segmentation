server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # index.html and config.js are the two files that actually change from
    # one deploy to the next (a new build, a new API_BASE_URL). Without
    # this, a browser could keep serving a stale copy of either from its own
    # cache well after a redeploy — exactly the "why is it still doing the
    # old thing" confusion that's already bitten this project once before,
    # over local dev caching rather than nginx, but the fix is the same
    # instinct: don't let either of these two files go stale silently.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /js/config.js {
        add_header Cache-Control "no-cache";
    }
}
