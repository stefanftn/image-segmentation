# Scrape config for the local dev stack (back/deploy/docker-compose.yml).

global:
  scrape_interval: 15s

scrape_configs:
  # prometheus-net.AspNetCore (Program.cs's UseHttpMetrics()/MapMetrics()) - HTTP request
  # metrics plus the custom Counters/Gauges TaskPoller and StaleTaskSweeperWorker register
  # (imageseg_taskpoller_claimed_total, imageseg_inflight_tasks, imageseg_sweeper_force_failed_total).
  - job_name: imageseg-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8080"]

  # Already instrumented before this stack existed (see main.py's SEGMENT_REQUESTS etc.) -
  # this scrape config is what actually turns that into visible data.
  - job_name: ai-sidecar
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-sidecar:8000"]
