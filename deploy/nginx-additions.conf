# =============================================================================
# Dodaci za /opt/reverse-proxy/conf.d/default.conf na VM-u.
#
# NE zamenjuje ceo fajl - ovo su samo delovi koje treba dodati/izmeniti u postojećem
# default.conf. Nakon izmene:
#
#   docker exec reverse-proxy nginx -t
#   docker exec reverse-proxy nginx -s reload
#
# =============================================================================

# -----------------------------------------------------------------------------------------
# IZMENA postojećeg bloka za moleraj.stefanpopovic.site (443 ssl)
# -----------------------------------------------------------------------------------------
# Postojeći 80->443 redirect blok za moleraj OSTAJE NEPROMENJEN - već postoji u default.conf.
#
# Postojeći 443 blok ima JEDAN `location /` koji sve šalje na :4001. Taj jedan location treba
# zameniti sa ČETIRI - path-based routing, isti šablon koji već koristiš za Ketering, samo sada
# treba i poseban blok za SignalR hub (WebSocket, dugotrajna konekcija - default nginx read
# timeout od 60s bi je gasio, zato proxy_read_timeout ovde), plus /monitoring/ za Grafanu
# (vidi njen komentar ispod).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name moleraj.stefanpopovic.site;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Grafana, nested pod istim subdomenom kao ostatak app-a (moleraj.stefanpopovic.site) ali
    # kao zaseban top-level path segment - /monitoring/, sestrinski sa /api/, /hubs/ i /, a ne
    # ugnježdeno unutar /api/ (to bi mešalo stvarni REST API sa monitoring UI-jem).
    #
    # Bez proxy_pass URI dela (nema ničega posle porta) - nginx prosleđuje CEO originalni URI
    # nepromenjen (/monitoring/d/... ostaje /monitoring/d/... na Grafana strani). To je namerno:
    # Grafana je konfigurisana sa GF_SERVER_ROOT_URL=.../monitoring/ i
    # GF_SERVER_SERVE_FROM_SUB_PATH=true (deploy/docker-compose.prod.yml), pa i sama Grafana
    # očekuje da vidi taj puni prefiks, ne da joj bude skinut.
    location /monitoring/ {
        proxy_pass http://host.docker.internal:4006;

        proxy_http_version 1.1;

        # Grafana Live (dashboard auto-refresh preko WebSocket-a) - isti razlog kao SignalR hub
        # ispod, samo za Grafanin sopstveni websocket kanal.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ceo REST API (ImagesController, MaskGroupsController, AuthController - svi su pod /api/).
    location /api/ {
        proxy_pass http://host.docker.internal:4001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub (TaskStatusHub) - odvojeno od /api/ jer treba WebSocket upgrade + duži
    # timeout. Bez ovoga bi svaka SignalR konekcija pukla posle 60s neaktivnosti.
    location /hubs/ {
        proxy_pass http://host.docker.internal:4001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sve ostalo (frontend statika) ide na frontend kontejner.
    location / {
        proxy_pass http://host.docker.internal:4004;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# -----------------------------------------------------------------------------------------
# NOVO - minio.stefanpopovic.site (dva bloka, potpuno novi, dodaju se u default.conf)
# -----------------------------------------------------------------------------------------
# Isti wildcard sertifikat (*.stefanpopovic.site) pokriva ovaj poddomen bez izmena, jer je
# na istom nivou kao docs/moleraj/ketering (wildcard NE bi pokrio npr.
# storage.moleraj.stefanpopovic.site - dvostruko ugnježdeno, samo jedan nivo je pokriven).

server {
    listen 80;
    listen [::]:80;

    server_name minio.stefanpopovic.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name minio.stefanpopovic.site;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Presigned URL-ovi nose svoj potpis u query string-u (X-Amz-Signature=...), vezan za Host
    # header kojim je zahtev potpisan (MinIoStorageService.cs potpisuje sa
    # Storage__MinIO__PublicEndpoint = https://minio.stefanpopovic.site). proxy_set_header Host
    # $host mora ostati tačno ovako - da MinIO na drugoj strani vidi ISTI Host koji je backend
    # koristio pri potpisivanju, inače je potpis nevažeći.
    location / {
        proxy_pass http://host.docker.internal:4005;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Veliki fajlovi (originalne slike, maske) - default nginx buffer/timeout je dovoljan
        # za ono što ovaj sistem šalje (do 10MB po upload validaciji), ali malo prostora za
        # spor upload/download ne škodi.
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }
}
