# Scrape config for production (deploy/docker-compose.prod.yml). Identical targets to
# back/deploy/monitoring/prometheus.yml - "web" and "ai-sidecar" are the service names on the
# same "imageseg" Docker network either way, only the compose file that builds that network
# differs between dev and prod.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: imageseg-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8080"]

  - job_name: ai-sidecar
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-sidecar:8000"]
