name: Frontend — build & deploy

on:
  push:
    branches: [main]
    paths:
      - "front/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  ENV_FILE: /home/moleraj/imageseg-secrets/.env
  COMPOSE_FILE: deploy/docker-compose.prod.yml

jobs:
  build-and-deploy:
    runs-on: [self-hosted, moleraj]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t imageseg-frontend:latest -f front/Dockerfile front

      - name: Redeploy only the frontend container
        run: docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d frontend

      - name: Prune dangling images
        run: docker image prune -f
